version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: court-booking-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    container_name: court-booking-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/court_booking_db
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongo-data:
