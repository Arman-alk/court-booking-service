name: Court Booking System CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'court-booking-service/package-lock.json'

      - name: Install Dependencies
        working-directory: ./court-booking-service
        run: npm ci

      - name: Run Test Suite
        working-directory: ./court-booking-service
        run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/court_booking_test
          PORT: 5000
          NODE_ENV: test
